name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install paramiko keyring  # optional SFTP deps (needed by sftp/scheduler modules)

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/

      - name: Type-check with mypy
        run: mypy src/ --exclude 'src/ui_flet'

      - name: Security scan with bandit
        run: bandit -r src/ -q -c pyproject.toml

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=80

      # Validate EVERY discoverable mapping config, derived from available_configs()
      # rather than a hand-kept list — the old inline list named the 7 district
      # configs (myedbc + sd40/48/51/54/60/74) and so never validated the other 4
      # bundled ones (mbp_all, mbp_core, mbponly, sd51attendance), while CLAUDE.md
      # claimed all 11. 7 + 4 = 11. The count is PINNED so a deleted or unregistered
      # config fails loudly instead of silently shrinking the sweep; a bare glob
      # without the pin would not. Keep EXPECTED_CONFIGS in lockstep with the
      # Makefile's `validate-config` list.
      - name: Validate all mapping configs
        run: |
          python - <<'PY'
          from src.config.loader import available_configs, load_config

          EXPECTED_CONFIGS = 11
          names = available_configs()
          for name in names:
              load_config(name)
              print(f"{name}: OK")
          if len(names) != EXPECTED_CONFIGS:
              raise SystemExit(
                  f"FAIL: expected {EXPECTED_CONFIGS} mapping configs, discovered {len(names)}: {names}"
              )
          print(f"validated {len(names)} mapping configs")
          PY
