name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # This repo is PUBLIC and handles student PII. The pre-commit hook runs the same
      # scan, but a `--no-verify` commit (or a contributor without core.hooksPath set)
      # bypasses it, so CI is the backstop that actually blocks the merge.
      #
      # Placed here, BEFORE `pip install`, because the script is stdlib-only + `git` — so
      # a leak fails the job in ~15s instead of after the dependency install and the full
      # suite. A leak is a disclosure; the clock matters. The script's docstring carries
      # the allowlist model and its ONE declared gap (tests/ is exempt — synthetic data
      # by contract).
      - name: Check for plaintext email addresses
        run: python scripts/check_no_emails.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install paramiko keyring  # optional SFTP deps (needed by sftp/scheduler modules)

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/

      - name: Type-check with mypy
        run: mypy src/ --exclude 'src/ui_flet'

      - name: Security scan with bandit
        run: bandit -r src/ -q -c pyproject.toml

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=80

      # Validate EVERY discoverable mapping config, derived from available_configs()
      # rather than a hand-kept list — the old inline list named the 7 district
      # configs (myedbc + sd40/48/51/54/60/74) and so never validated the other 4
      # bundled ones (mbp_all, mbp_core, mbponly, sd51attendance), while CLAUDE.md
      # claimed all 11. 7 + 4 = 11. The count is PINNED so a deleted or unregistered
      # config fails loudly instead of silently shrinking the sweep; a bare glob
      # without the pin would not. Keep EXPECTED_CONFIGS in lockstep with the
      # Makefile's `validate-config` list.
      - name: Validate all mapping configs
        run: |
          python - <<'PY'
          from src.config.loader import available_configs, load_config

          EXPECTED_CONFIGS = 20
          names = available_configs()
          for name in names:
              load_config(name)
              print(f"{name}: OK")
          if len(names) != EXPECTED_CONFIGS:
              raise SystemExit(
                  f"FAIL: expected {EXPECTED_CONFIGS} mapping configs, discovered {len(names)}: {names}"
              )
          print(f"validated {len(names)} mapping configs")
          PY

  # A SECOND pytest leg on Windows (plan 0049 S-1a-i.5). The suite carries
  # ``WINDOWS_ONLY``-marked tests — the real DPAPI round trips, the winreg access-mask
  # parity pin — that have never once run in CI: the job above is ubuntu-only, so they
  # skipped on every pull request and were verified only on a developer's machine.
  # Machine scope seals a credential with DPAPI, so "verified locally" is not enough.
  #
  # Deliberately NOT a copy of the job above:
  #   * NO coverage gate. Coverage stays the ubuntu job's single gate — a second
  #     ``--cov-fail-under`` over a different skip set is a second, differently
  #     calibrated gate that would fail for reasons nobody changed.
  #   * NO lint / type / security / config steps — those are OS-independent and already
  #     enforced once.
  #   * The ubuntu job's name and steps are UNCHANGED, so the existing required check
  #     keeps its identity.
  # No test may depend on the runner's real elevation state or on how this box is
  # provisioned: every such branch is driven by monkeypatch on both legs.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install paramiko keyring  # optional SFTP deps (needed by sftp/scheduler modules)

      - name: Run tests
        run: python -m pytest tests/ -q
