name: flet-pack

# Reusable per-OS pack + smoke for the windowed/no-console/offline Flet exe of the
# Flet-default entry point (src/main.py, no-argv branch). Called by release.yml (tag)
# AND flet-verify.yml (PR/dispatch) — one matrix, two callers (anti-rot). This IS the
# public Release builder: release.yml attaches these artifacts (one exe/OS + SHA-256).
#
# SECURITY (RC4): least-privilege by construction. A `flet pack` runs arbitrary PR
# code, so this reusable workflow takes NO secrets and grants only read scope. On a PR
# (flet-verify.yml) the built exe is an `upload-artifact` ONLY; on a tag, release.yml
# downloads and attaches it.
on:
  workflow_call:

permissions:
  contents: read

env:
  FLET_VERSION: "0.85.3" # keep in lockstep with the pinned flet/flet-desktop/flet-web

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-OS desktop flavor (RC6): warm-up, cache key, and `flet pack` MUST
          # provably agree. ALL THREE now ship `light` (D-0037-1, 2026-07-28): the
          # app plays no audio or video, so the `full` client's media stack was
          # tens of MB of dead weight in every district download. Linux has shipped
          # `light` since PLAT-0b; this run is the Windows/macOS evidence.
          - os: windows-latest
            flavor: light
            sep: ";"
            require_close: "--require-close"
            # The brand icon runtime surface (`page.window.icon`) + the Explorer exe icon
            # are Windows-only; PyInstaller `--icon` wants a `.icns` on macOS, so scope the
            # `.ico` to Windows to avoid a mac conversion failure. The .ico is still BUNDLED
            # on all OSes via `--add-data assets` (harmless elsewhere; tiny).
            icon_arg: "--icon assets/districtsync.ico"
          - os: ubuntu-22.04 # pinned: the Linux client filename encodes the distro
            flavor: light
            sep: ":"
            require_close: ""
            icon_arg: ""
          - os: macos-latest
            flavor: light
            sep: ":"
            require_close: ""
            icon_arg: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FLET_DESKTOP_FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stamp the release version so the built exe's `--version` reports the real
      # tag. A frozen PyInstaller build ships no package metadata, so importlib
      # always misses → app_version() (src/utils/version.py) reads this bundled
      # module first. flet-pack is shared: release.yml calls it on a tag (→ the
      # real version, e.g. v3.4.0 → '3.4.0'); flet-verify.yml on a PR/dispatch
      # (→ 'dev' preview). Bundled via `--hidden-import src._version` in the pack
      # step below; src/_version.py is git-ignored (exists only inside a build).
      - name: Stamp version (real on a tag, else dev)
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version = '${GITHUB_REF_NAME#v}'" > src/_version.py
          else
            echo "version = 'dev'" > src/_version.py
          fi
          cat src/_version.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Linux DESKTOP-GUI runtime libs (the Flet client links libsecret + GL/GTK)
      # + xvfb so the smoke can open a real window headlessly.
      - name: Linux desktop GUI runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0 libgtk-3-0 libgl1 libglib2.0-0 xvfb

      # Single-source pins (RC7): install via -r ONLY — no inline `pip install pkg`.
      # requirements-dev.txt carries pyinstaller/pefile/psutil + flet-cli/flet-web.
      - name: Install pinned stack (runtime + build/smoke deps)
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Report flet + tooling versions
        run: |
          python -c "import importlib.metadata as m; print('flet', m.version('flet'), '| flet-desktop', m.version('flet-desktop'), '| flet-cli', m.version('flet-cli'), '| pyinstaller', m.version('pyinstaller'))"

      # Content-bound cache key (RC6): OS + flet version + flavor. The cache is a
      # pure optimization — a miss self-downloads in the warm-up below and the
      # cache-populated assert still gates, so a miss can never silently break the
      # offline guarantee.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.flet
          key: flet-client-${{ runner.os }}-${{ env.FLET_VERSION }}-${{ env.FLET_DESKTOP_FLAVOR }}

      - name: Warm Flet client cache (headless, no window)
        run: python -c "import flet_desktop; print('cached at:', flet_desktop.ensure_client_cached())"

      # RC1a — cache-populated assert: the warm-up's download fallback succeeds
      # silently, so a MISS is invisible without this. Fail the job if the client
      # dir is absent or empty. The embedded archive (get_package_bin_dir()), NOT
      # the cache, is the runtime source of truth — but a populated cache is the
      # input `flet pack` copies into the bundle, so it must exist now.
      - name: Assert client cache populated
        shell: bash
        run: |
          DIR="$HOME/.flet/client/flet-desktop-${FLET_DESKTOP_FLAVOR}-${FLET_VERSION}"
          if [ ! -d "$DIR" ] || [ -z "$(ls -A "$DIR" 2>/dev/null)" ]; then
            echo "FAIL: client cache not populated at $DIR"
            ls -la "$HOME/.flet/client" || true
            exit 1
          fi
          echo "client cache OK: $DIR"

      # Pack the Flet-default entry point (src/main.py, no-argv branch) into a
      # windowed/no-console/offline onefile exe — THE public Release binary.
      # --add-data separator is per-OS (matrix `sep`). The FULL src.* + flet
      # hidden-import set is listed explicitly (belt-and-braces — registry.py
      # statically imports the transformers, but match release.yml's style).
      # NOTE: `flet pack` has NO native --paths/--exclude-module; raw PyInstaller
      # flags go through --pyinstaller-build-args, and each token MUST be its own
      # `--pyinstaller-build-args=<token>` (flet's `nargs="*"` stops at flag-like
      # tokens, and PyInstaller needs `--paths` and `.` as separate args).
      # --exclude-module streamlit/src.ui is belt-and-braces (both removed at CUT-1)
      # so a stray transitive can never re-bloat the exe with a dead UI stack.
      - name: Pack windowed offline Flet exe
        shell: bash
        run: |
          flet pack src/main.py --name DistrictSync \
            --yes \
            ${{ matrix.icon_arg }} \
            --add-data "config${{ matrix.sep }}config" \
            --add-data "assets${{ matrix.sep }}assets" \
            --hidden-import flet \
            --hidden-import flet_desktop \
            --hidden-import src.ui_flet.launcher \
            --hidden-import src.ui_flet.shell \
            --hidden-import src.ui_flet.nav \
            --hidden-import src.ui_flet.tokens \
            --hidden-import src.ui_flet.theme \
            --hidden-import tkinter \
            --hidden-import pandas \
            --hidden-import pydantic \
            --hidden-import pydantic_core \
            --hidden-import yaml \
            --hidden-import logging.config \
            --hidden-import src.etl.transformers.registry \
            --hidden-import src.etl.transformers.context \
            --hidden-import src.etl.transformers.base \
            --hidden-import src.etl.transformers.students \
            --hidden-import src.etl.transformers.staff \
            --hidden-import src.etl.transformers.family \
            --hidden-import src.etl.transformers.classes \
            --hidden-import src.etl.transformers.enrollments \
            --hidden-import src.etl.transformers.blended \
            --hidden-import src.etl.transformers.course_info \
            --hidden-import src.etl.transformers.student_courses \
            --hidden-import src.etl.transformers.student_attendance \
            --hidden-import src.config.app_config \
            --hidden-import src.config.loader \
            --hidden-import src.utils.paths \
            --hidden-import src.utils.validators \
            --hidden-import src.utils.logger \
            --hidden-import src.utils.version \
            --hidden-import src._version \
            --hidden-import ${{ runner.os == 'Windows' && 'src.scheduler.windows' || 'src.scheduler.linux' }} \
            --hidden-import src.scheduler.linux \
            --hidden-import ${{ runner.os == 'Windows' && 'keyring.backends.Windows' || (runner.os == 'macOS' && 'keyring.backends.macOS' || 'keyring.backends.SecretService') }} \
            ${{ runner.os == 'Linux' && '--hidden-import keyring.backends.libsecret' || '' }} \
            ${{ runner.os == 'Windows' && '--hidden-import src.scheduler.task_com --hidden-import src.scheduler.elevated_apply --hidden-import win32com --hidden-import win32com.client --hidden-import pythoncom --hidden-import win32timezone' || '' }} \
            --pyinstaller-build-args="--paths" --pyinstaller-build-args="." \
            --pyinstaller-build-args="--exclude-module" --pyinstaller-build-args="streamlit" \
            --pyinstaller-build-args="--exclude-module" --pyinstaller-build-args="src.ui"

      # RC1b — packed-archive embed assert: a fresh flet_desktop@0.85.3 ships NO
      # bundled archive; `flet pack` only embeds the client by copying the
      # populated cache into the bundle as flet_desktop/app/<archive>. Prove the
      # build manifest references it — fail if absent.
      - name: Assert packed exe embeds the client
        shell: bash
        run: |
          MANIFEST="build/DistrictSync/Analysis-00.toc"
          if [ ! -f "$MANIFEST" ]; then
            echo "FAIL: build manifest not found at $MANIFEST"
            ls -la build/DistrictSync 2>/dev/null || true
            exit 1
          fi
          python scripts/ci_flet_pack_smoke.py --assert-embed "$MANIFEST"

      # Size evidence for the flavor decision — COMPARABLE across OSes: always the
      # total BYTES of the shipped artifact (recursively summed for the macOS .app,
      # which is a directory), never `du -sh`'s block-rounded human string. Written
      # to the step summary so all three OSes' numbers land in ONE greppable place
      # instead of three separate job logs (the summary retains with the run, exactly
      # like the logs do — this is about findability, not longevity).
      - name: Echo measured artifact size (size budget)
        shell: bash
        run: |
          if [ -f "dist/DistrictSync.exe" ]; then F="dist/DistrictSync.exe";
          elif [ -d "dist/DistrictSync.app" ]; then F="dist/DistrictSync.app";
          else F="dist/DistrictSync"; fi
          ls -la "$F" || true
          # bytes + MB in one shot; a directory (the macOS .app) is summed recursively.
          SIZES=$(python -c "import os,sys;p=sys.argv[1];j=os.path.join;t=sum(os.path.getsize(j(r,f)) for r,_d,fs in os.walk(p) for f in fs if os.path.isfile(j(r,f))) if os.path.isdir(p) else os.path.getsize(p);print(t, f'{t/1e6:.1f}')" "$F")
          SIZE=${SIZES%% *}
          MB=${SIZES##* }
          echo "measured size: $SIZE bytes (${MB} MB)"
          {
            echo "### Packed artifact size"
            echo ""
            echo "| runner | desktop flavor | bytes | MB |"
            echo "|---|---|---|---|"
            echo "| \`${{ matrix.os }}\` | \`${{ matrix.flavor }}\` | $SIZE | $MB |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # CLI smokes — the packed artifact's OTHER branch (--sis/--input/--output)
      # ---------------------------------------------------------------------
      # The GUI smoke below proves a window opens. Nothing proved the same exe still
      # CONVERTS — the branch every district actually runs nightly — so a packaging
      # regression in the ETL path could ship. Five phases against the real artifact,
      # exit codes primary and strings secondary. Only phase 3 (`write-run`) converts
      # the fixture end-to-end; 1 starts the exe, 2 previews, 4 converts through a
      # mapping config planted in the profile (never bundled in the exe), 5 boots on a
      # corrupt config plant.
      #
      # ONE invocation, `--phase all`: the phase ORDER is load-bearing (phase 2 pins
      # history.db absent so phase 3's "the store was created" check is unambiguous;
      # phase 5 plants a config.json and so must run last) and it lives in exactly one
      # place — CLI_SMOKE_PHASES in the script. Five separate workflow steps would have
      # been a second, hand-kept copy of that order, free to drift silently. The script
      # prints `-- <phase> --` per phase and `cli smoke: FAIL (<phase>)`, so which phase
      # failed stays obvious in the log.
      #
      # NO xvfb: these open no window. Absolute paths throughout (the frozen exe
      # chdirs); the fixture defaults to the committed SD74 snapshot input, resolved
      # from the script's own repo root, so it is NOT re-specified here.
      # DISTRICTSYNC_DATA_DIR points the run at a throwaway profile
      # (src/utils/paths.user_data_dir step 0 — platformdirs ignores LOCALAPPDATA on
      # Windows, so this env var is the only way to keep a frozen exe off the runner's
      # real profile); the script REFUSES to run any phase without it. The profile dir
      # lives under $RUNNER_TEMP and is discarded with the runner — phases 4 and 5 remove
      # only what they planted (an overlay YAML, a config.json), so the log survives for
      # the failure diagnostics.
      - name: CLI smokes — version, dry run, write run, user overlay, corrupt profile
        shell: bash
        env:
          DISTRICTSYNC_DATA_DIR: ${{ runner.temp }}/dsync-smoke-profile
        run: |
          python scripts/ci_flet_pack_smoke.py "$GITHUB_WORKSPACE/dist" DistrictSync \
            --cli-smoke --phase all --artifact binary \
            --work-dir "$RUNNER_TEMP/dsync-smoke-work"

      # Smoke the REAL exe: PE subsystem (win) + offline-embed (all, gating) +
      # zero-orphan close (win gating via --require-close; lin/mac INFO-only).
      # Linux runs under xvfb so the client opens a real window.
      # macOS is NOT here: since plan 0045 it smokes the .app inside the mounted
      # DMG instead — the artifact districts actually download.
      - name: Smoke the packed exe (Windows)
        if: runner.os == 'Windows'
        run: python scripts/ci_flet_pack_smoke.py dist DistrictSync ${{ matrix.require_close }}

      - name: Smoke the packed exe (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/ci_flet_pack_smoke.py dist DistrictSync ${{ matrix.require_close }}

      # ---------------------------------------------------------------------
      # macOS: wrap the .app in a DMG — the district-facing download (plan 0045)
      # ---------------------------------------------------------------------
      # A macOS `flet pack` emits BOTH `dist/DistrictSync.app` (the real bundle) and
      # `dist/DistrictSync` (a bare onefile binary). The release used to publish the
      # bare one, which Finder can only open in a text editor: no extension, and a
      # browser download carries no executable bit, so LaunchServices has nothing to
      # identify it with. The fix is to ship the bundle — and a bundle can only reach
      # a district intact inside a container, because `upload-artifact` does NOT
      # preserve POSIX mode bits. Hence: build the image HERE, on the runner, while
      # the bits are still right. Doing it in release.yml would package an already
      # permission-stripped bundle.
      #
      # The .app is MOVED (not copied) into the staging dir, so `dist/` is left
      # holding exactly the two artifacts we publish — the DMG and the bare binary
      # kept for a headless Mac — and the upload glob below needs no exclusion.
      # The `Applications` symlink is what makes the mounted window a drag target.
      - name: Build the macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg-staging"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          mv dist/DistrictSync.app "$STAGE/DistrictSync.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname DistrictSync \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            dist/DistrictSync-macos.dmg
          ls -la dist/
          SIZE=$(stat -f%z dist/DistrictSync-macos.dmg)
          MB=$(python -c "print(f'{$SIZE/1e6:.1f}')")
          echo "dmg size: $SIZE bytes (${MB} MB)"
          {
            echo ""
            echo "| artifact | bytes | MB |"
            echo "|---|---|---|"
            echo "| \`DistrictSync-macos.dmg\` | $SIZE | $MB |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # macOS: prove the DMG as DELIVERED (plan 0045) — the gating macOS smoke
      # ---------------------------------------------------------------------
      # Until this existed, `resolve_artifact`'s fixed candidate order meant every
      # macOS smoke ran against the bare binary and NOTHING ever launched the .app.
      # That matters more than usual here: PyInstaller warns on every macOS pack that
      # onefile + a windowed .app "clashes with macOS's security", so whether the
      # bundle starts at all was an open question this workflow could not answer.
      # These steps answer it against the mounted image, so a green run means the
      # bytes a district downloads mount, carry an executable bundle, and boot with
      # the Flet client embedded.
      #
      # -mountpoint is explicit on purpose: /Volumes auto-naming would append " 1"
      # if anything were already mounted there, and the asserts would then be
      # inspecting a different image than the one just built.
      - name: Verify + mount the DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          hdiutil verify dist/DistrictSync-macos.dmg
          mkdir -p "$RUNNER_TEMP/dmg-mnt"
          hdiutil attach dist/DistrictSync-macos.dmg \
            -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg-mnt"
          ls -la "$RUNNER_TEMP/dmg-mnt"

      - name: Assert the mounted bundle is intact + executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python scripts/ci_flet_pack_smoke.py \
            --assert-mounted-app "$RUNNER_TEMP/dmg-mnt" DistrictSync

      - name: Smoke the mounted .app (offline embed, gating)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python scripts/ci_flet_pack_smoke.py "$RUNNER_TEMP/dmg-mnt" DistrictSync \
            --artifact bundle

      # always(): a wedged mount would outlive the job and break the next one on a
      # reused runner. `|| true` so cleanup can never mask the real failure above.
      - name: Detach the DMG
        if: always() && runner.os == 'macOS'
        shell: bash
        run: hdiutil detach "$RUNNER_TEMP/dmg-mnt" || true

      # macOS uploads exactly two files: the DMG (districts) and the bare binary
      # (headless CLI). The .app is not among them — it was MOVED into the DMG
      # staging dir above, because uploading it loose would strip its mode bits and
      # hand anyone who used it the same broken download this plan fixes.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: DistrictSync-${{ matrix.os }}
          path: dist/DistrictSync*
          retention-days: 5
