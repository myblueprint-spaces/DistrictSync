name: Release

on:
  push:
    tags:
      - "v*"
  # Rehearsal path - builds and SIGNS, publishes nothing (publish-release is
  # tag-gated below). This exists so the signing steps can be exercised LIVE
  # without cutting a release: plan 0041 Slice 5 requires signing to land
  # verified, never dormant - "guarded steps that have never run are not
  # known-good; flip-a-secret day would really be debug-never-run-steps day".
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------------
  # Gate on CI's own result for THIS commit instead of re-running the suite
  # (DSYNC-54). ci.yml already ran tests + the 80% coverage gate (plus lint,
  # types, bandit, configs, Windows and the drift matrix, which the old copy here
  # did not) on the pushed commit; re-running it cost ~17 minutes per release.
  # Fails CLOSED: no CI run for the commit, or no green one, stops the release.
  # A run still in progress is waited on.
  # -----------------------------------------------------------------------
  ci-green:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a green CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA"             --limit 20 --json databaseId,status,conclusion)
          echo "CI runs for $GITHUB_SHA: $runs"
          if [ "$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$runs")" -gt 0 ]; then
            echo "CI is green on $GITHUB_SHA"; exit 0
          fi
          pending=$(jq -r '[.[] | select(.status != "completed")][0].databaseId // empty' <<<"$runs")
          if [ -n "$pending" ]; then
            echo "waiting for CI run $pending"
            gh run watch "$pending" -R "$GITHUB_REPOSITORY" --exit-status --interval 30
            exit 0
          fi
          echo "::error::no green CI run on $GITHUB_SHA - push it to main (or a PR) and let CI pass first"
          exit 1

  # -----------------------------------------------------------------------
  # THE public exe — windowed/no-console/offline Flet-default onefile built +
  # smoked on Win+Linux+macOS via the reusable matrix. Packs src/main.py: no
  # args → the Flet shell; --sis/--input/--output → the CLI. One exe per OS.
  # -----------------------------------------------------------------------

  build-flet:
    needs: ci-green
    uses: ./.github/workflows/flet-pack.yml
    with:
      upload: true # PR builds (flet-verify.yml) upload nothing (DSYNC-54)

  # -----------------------------------------------------------------------
  # Sign the Windows exe - Azure Trusted Signing (plan 0041 Slice 5).
  # -----------------------------------------------------------------------
  # DELIBERATELY NOT in flet-pack.yml. That reusable workflow is called by
  # flet-verify.yml on every PR, so it packs ARBITRARY PR CODE, and its RC4 note
  # keeps it secret-free with `contents: read` by construction. Granting it
  # `id-token: write` would let any PR author mint a token that signs binaries as
  # "myBlueprint Corp." - a supply-chain hole, not a convenience. Signing
  # therefore lives HERE, in the tag/dispatch-only workflow, on the built artifact.
  #
  # `environment: release` is REQUIRED, not decorative: the federated credential on
  # the `github-districtsync-signing` app registration is scoped to the subject
  # `repo:myblueprint-spaces@87142684/DistrictSync@1212825406:environment:release`
  # (the repo issues immutable ID-pinned subjects, `use_immutable_subject: true`).
  # A job without it presents a non-matching subject and azure/login fails.
  #
  # Order is load-bearing: sign FIRST, then re-smoke. Signing rewrites the PE, so
  # the bytes the smoke proves must be the bytes districts download - the plan-0045
  # lesson (test the artifact that ships, not its ancestor) applied to signing.
  #
  # Windows ONLY. Trusted Signing signs PE files; the macOS .app/.dmg and the Linux
  # binary would need an Apple Developer ID + notarization, which we do not have.
  sign-windows:
    needs: build-flet
    runs-on: windows-latest
    environment: release
    permissions:
      id-token: write # OIDC token for azure/login - the ONLY elevated scope here
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DistrictSync-windows-latest
          path: dist

      # Fail loudly if the artifact arrives already signed - that would mean the
      # pack job grew a signing step and this job's "sign the unsigned build"
      # premise is silently wrong. The absence assert; its positive twin is the
      # verify step below, which proves the mechanism actually works.
      - name: Assert the downloaded exe is UNSIGNED
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist/DistrictSync.exe
          Write-Output "pre-sign status: $($sig.Status)"
          if ($sig.Status -eq 'Valid') {
            Write-Error "dist/DistrictSync.exe is ALREADY signed before the signing step"
            exit 1
          }

      - name: Azure login (OIDC - no stored secret)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Azure Trusted Signing
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The positive twin of the absence assert above. /pa = Authenticode policy.
      # A Trusted Signing certificate lives ~3 days, so the TIMESTAMP is what keeps
      # the signature valid after it expires - assert it explicitly rather than
      # assume the action requested one.
      - name: Verify the signature
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found on the runner"; exit 1 }
          Write-Output "using $($signtool.FullName)"
          & $signtool.FullName verify /pa /v dist\DistrictSync.exe
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool verify FAILED"; exit 1 }

          $sig = Get-AuthenticodeSignature dist\DistrictSync.exe
          Write-Output "post-sign status : $($sig.Status)"
          Write-Output "post-sign subject: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "signature is not Valid"; exit 1 }
          if ($null -eq $sig.TimeStamperCertificate) {
            Write-Error "signature carries NO timestamp - it would die with the 3-day cert"
            exit 1
          }

      # Re-run BOTH smokes against the SIGNED bytes. flet-pack proved the unsigned
      # build converts and opens a window; appending a signature rewrites the PE,
      # so neither result carries over to what we publish.
      - name: CLI smokes on the SIGNED exe
        shell: bash
        env:
          DISTRICTSYNC_DATA_DIR: ${{ runner.temp }}/dsync-signed-profile
        run: |
          python scripts/ci_flet_pack_smoke.py "$GITHUB_WORKSPACE/dist" DistrictSync \
            --cli-smoke --phase all --artifact binary \
            --work-dir "$RUNNER_TEMP/dsync-signed-work"

      - name: GUI smoke on the SIGNED exe
        run: python scripts/ci_flet_pack_smoke.py dist DistrictSync --require-close

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DistrictSync-windows-signed
          path: dist/DistrictSync.exe
          retention-days: 1

  # -----------------------------------------------------------------------
  # The Windows INSTALLER, rehearsal only (plan 0054 S6a, DSYNC-67). Publishes NOTHING.
  # -----------------------------------------------------------------------
  # Two jobs, both `workflow_dispatch`-only: a tag release does not run them and does not
  # wait for them, so every existing asset above is built, signed and attached exactly as
  # before. (The installer joins the Release in S8, once the build can update itself.)
  #
  # installer-build holds NO Azure scope: it builds the INSTALLED-flavour one-folder app with the
  # private shared updater package (the read key is a repo-level secret and goes only to the
  # checkout step), and hands the unsigned folder to installer-windows, the job that signs.
  installer-build:
    needs: ci-green
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      FLET_VERSION: "0.85.3" # keep in lockstep with flet-pack.yml and the pinned flet
      FLET_DESKTOP_FLAVOR: light
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A rehearsal is never a version tag. Velopack needs a SemVer version; a throwaway one
      # that cannot collide with a real release (0.0.<run number>).
      - name: Stamp the rehearsal version
        shell: bash
        run: |
          echo "version = '0.0.${{ github.run_number }}'" > src/_version.py
          cat src/_version.py

      - name: Stamp build flavour (installed)
        shell: bash
        run: |
          echo "flavor = 'installed'" > src/_build_flavor.py
          cat src/_build_flavor.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned stack (runtime + build/smoke deps)
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-updater.txt

      # The private shared updater package, from the pinned commit, checked against the pinned tree hash
      # (scripts/updater_package.py). The installed flavour NEEDS it: this job fails closed without the key.
      - name: Read the pinned shared-package commit
        id: updater-pin
        shell: bash
        run: echo "commit=$(python scripts/updater_package.py commit)" >> "$GITHUB_OUTPUT"

      - name: Check out the shared updater package at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myblueprint-spaces/myb-desktop-shared
          ref: ${{ steps.updater-pin.outputs.commit }}
          ssh-key: ${{ secrets.MYB_DESKTOP_SHARED_DEPLOY_KEY }}
          path: .shared-updater
          persist-credentials: false

      - name: Install the shared updater package (built from the pin, tree hash checked)
        shell: bash
        run: python scripts/updater_package.py install --source .shared-updater

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.flet
          key: flet-client-${{ runner.os }}-${{ env.FLET_VERSION }}-${{ env.FLET_DESKTOP_FLAVOR }}

      - name: Warm Flet client cache (headless, no window)
        run: python -c "import flet_desktop; print('cached at:', flet_desktop.ensure_client_cached())"

      # The same pack as flet-pack.yml's one-folder job (kept identical by tests/test_installer_workflow.py).
      - name: Pack the one-folder app with the Flet client inside it
        shell: bash
        run: |
          set -euo pipefail
          CLIENT="$HOME/.flet/client/flet-desktop-${FLET_DESKTOP_FLAVOR}-${FLET_VERSION}/flet"
          if [ ! -f "$CLIENT/flet.exe" ]; then
            echo "FAIL: no flet.exe in the warmed client cache at $CLIENT"
            exit 1
          fi
          flet pack src/main.py --name DistrictSync \
            --yes -D \
            --icon assets/districtsync.ico \
            --add-data "config;config" \
            --add-data "assets;assets" \
            --add-data "$(cygpath -w "$CLIENT");flet_view" \
            $(python scripts/flet_pack_args.py windows --installed) \
            --pyinstaller-build-args="--paths" --pyinstaller-build-args="." \
            --pyinstaller-build-args="--exclude-module" --pyinstaller-build-args="streamlit" \
            --pyinstaller-build-args="--exclude-module" --pyinstaller-build-args="src.ui"

      - name: Assert the folder carries its own Flet client
        shell: bash
        run: python scripts/ci_flet_pack_smoke.py --assert-bundled-client dist DistrictSync

      # The installed flavour must carry the Velopack runtime AND both shared packages: without them the app
      # silently runs with no updater and no start guard, and no smoke would notice.
      - name: Assert the folder carries the Velopack runtime and the shared updater packages
        shell: bash
        run: |
          set -euo pipefail
          for want in 'velopack*' 'myb_desktop_updater*' 'myb_start_guard*'; do
            FOUND=$(find dist/DistrictSync -iname "$want" | head -3)
            echo "$want: $FOUND"
            [ -n "$FOUND" ] || { echo "FAIL: nothing named $want in the one-folder app"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DistrictSync-windows-installed-onedir
          path: dist/DistrictSync
          retention-days: 1
          if-no-files-found: error

  # Signs with the SAME identity as sign-windows (`environment: release`, OIDC, Azure Trusted Signing), packs with
  # vpk, then proves the signed installer the way a customer meets it: install, run, uninstall.
  installer-windows:
    needs: installer-build
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    permissions:
      id-token: write # OIDC token for azure/login - the ONLY elevated scope here
      contents: read
    env:
      PACK_ID: myBlueprint.DistrictSync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DistrictSync-windows-installed-onedir
          path: dist/DistrictSync

      # The absence assert, as in sign-windows: the folder must arrive UNSIGNED, or "sign the unsigned build" is silently false.
      - name: Assert the downloaded exe is UNSIGNED
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist/DistrictSync/DistrictSync.exe
          Write-Output "pre-sign status: $($sig.Status)"
          if ($sig.Status -eq 'Valid') { Write-Error "dist/DistrictSync/DistrictSync.exe is ALREADY signed before the signing step"; exit 1 }

      - name: Azure login (OIDC - no stored secret)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # vpk's version must equal the pinned `velopack` Python package (tests/test_installer_workflow.py).
      - name: Install vpk 1.2.161
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Write the signing metadata file (the signer reads a file, not three values)
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT_NAME: ${{ vars.SIGNING_ACCOUNT_NAME }}
          SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          @{ Endpoint = $env:SIGNING_ENDPOINT; CodeSigningAccountName = $env:SIGNING_ACCOUNT_NAME; CertificateProfileName = $env:SIGNING_CERTIFICATE_PROFILE_NAME } |
            ConvertTo-Json | Set-Content -Encoding utf8 signing-metadata.json

      - name: Pack and sign with vpk (Azure Trusted Signing)
        shell: pwsh
        run: |
          $version = "0.0.${{ github.run_number }}"  # the same rehearsal version installer-build stamped
          Write-Output "packing version $version"
          vpk pack --packId $env:PACK_ID --packTitle DistrictSync --packVersion $version --packDir dist/DistrictSync `
            --mainExe DistrictSync.exe --runtime win-x64 --outputDir releases `
            --azureTrustedSignFile signing-metadata.json
          if ($LASTEXITCODE -ne 0) { Write-Error "vpk pack failed"; exit 1 }
          Get-ChildItem releases | Format-Table Name, Length

      # Signature AND timestamp on the Setup (a Trusted Signing certificate lives ~3 days: the timestamp keeps it valid).
      - name: Verify the signature and the timestamp on the Setup
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found on the runner"; exit 1 }
          $setup = "releases\$($env:PACK_ID)-win-Setup.exe"
          & $signtool.FullName verify /pa /v $setup
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool verify FAILED on the Setup"; exit 1 }
          $sig = Get-AuthenticodeSignature $setup
          Write-Output "Setup status: $($sig.Status); subject: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "Setup signature is not Valid"; exit 1 }
          if ($null -eq $sig.TimeStamperCertificate) { Write-Error "Setup signature carries NO timestamp"; exit 1 }

      # Install exactly as a customer does (per user, silent). Velopack starts the app after a silent install;
      # that first start is ended before the smokes so they own the process table.
      - name: Install the signed Setup on the runner
        shell: pwsh
        run: |
          $setup = (Resolve-Path "releases\$($env:PACK_ID)-win-Setup.exe").Path
          Start-Process -FilePath $setup -ArgumentList "--silent" -Wait
          $root = Join-Path $env:LOCALAPPDATA $env:PACK_ID
          Write-Output "install root: $root"
          Get-ChildItem $root | Format-Table Name
          for ($i = 0; $i -lt 30 -and -not (Test-Path "$root\current\DistrictSync.exe"); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path "$root\current\DistrictSync.exe")) { Write-Error "the installed exe is missing"; exit 1 }
          Start-Sleep -Seconds 5
          Get-Process DistrictSync, flet -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

      # Every file the plan names must carry a valid, timestamped signature in the INSTALLED copy. A file vpk did not
      # sign is a failure, not a warning.
      - name: Verify the installed files are signed (exe, Flet client, Update.exe)
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA $env:PACK_ID
          $bad = @()
          foreach ($rel in @("current\DistrictSync.exe", "current\_internal\flet_view\flet.exe", "Update.exe")) {
            $sig = Get-AuthenticodeSignature (Join-Path $root $rel)
            Write-Output ("{0}: {1}; timestamp: {2}; subject: {3}" -f $rel, $sig.Status, ($null -ne $sig.TimeStamperCertificate), $sig.SignerCertificate.Subject)
            if ($sig.Status -ne 'Valid' -or $null -eq $sig.TimeStamperCertificate) { $bad += $rel }
          }
          $unsigned = Get-ChildItem "$root\current" -Recurse -Include *.exe, *.dll | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq 'NotSigned' }
          Write-Output "installed PE files not signed (information): $($unsigned.Count)"
          if ($bad.Count -gt 0) { Write-Error "not validly signed and timestamped: $($bad -join ', ')"; exit 1 }

      - name: CLI smokes on the INSTALLED signed copy
        shell: bash
        env:
          DISTRICTSYNC_DATA_DIR: ${{ runner.temp }}/dsync-installed-profile
        run: |
          python scripts/ci_flet_pack_smoke.py "$LOCALAPPDATA/$PACK_ID" DistrictSync \
            --cli-smoke --phase all --artifact installed \
            --work-dir "$RUNNER_TEMP/dsync-installed-work"

      - name: GUI smoke on the INSTALLED signed copy
        shell: bash
        run: python scripts/ci_flet_pack_smoke.py "$LOCALAPPDATA/$PACK_ID" DistrictSync --artifact installed --require-close

      # Uninstall, then assert it is gone (the throwaway profile is not part of the install and stays).
      - name: Uninstall and assert nothing is left
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA $env:PACK_ID
          Get-Process DistrictSync, flet -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path "$root\Update.exe") {
            & "$root\Update.exe" uninstall --silent
            for ($i = 0; $i -lt 30 -and (Test-Path "$root\current"); $i++) { Start-Sleep -Seconds 2 }
          }
          if (Test-Path "$root\current") { Write-Error "the install folder is still there after uninstall"; exit 1 }
          Write-Output "uninstalled: $root\current is gone"

      # A test artifact for a human to download and install like a customer (1 day). NEVER attached to a Release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DistrictSync-windows-installer-signed
          path: releases/myBlueprint.DistrictSync-win-Setup.exe
          retention-days: 1
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Publish release — attach the Flet-default exe (1/OS) + SHA-256 checksums.
  # The download `name:` values MUST byte-match flet-pack.yml's upload names
  # (DistrictSync-<matrix.os>): windows-latest / ubuntu-22.04 / macos-latest.
  # -----------------------------------------------------------------------

  publish-release:
    needs: [build-flet, sign-windows]
    # Tag-only: a workflow_dispatch rehearses build+sign and stops here.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DistrictSync-windows-signed
          path: artifacts/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DistrictSync-ubuntu-22.04
          path: artifacts/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DistrictSync-macos-latest
          path: artifacts/macos

      # macOS publishes TWO assets (plan 0045): the .dmg is the district-facing
      # download — a disk image whose .app survives with its executable bit intact —
      # and the bare binary stays for a headless Mac running the CLI, on the same
      # `chmod +x` footing as Linux. The bare binary is NOT the double-click artifact:
      # extension-less and non-executable after a browser download, Finder can only
      # open it in a text editor, which is the bug this replaced.
      - name: Rename and mark executables
        run: |
          mv artifacts/windows/DistrictSync.exe          artifacts/DistrictSync-windows.exe
          mv artifacts/linux/DistrictSync                artifacts/DistrictSync-linux
          mv artifacts/macos/DistrictSync-macos.dmg      artifacts/DistrictSync-macos.dmg
          mv artifacts/macos/DistrictSync                artifacts/DistrictSync-macos
          chmod +x artifacts/DistrictSync-linux artifacts/DistrictSync-macos

      # Integrity anchor (RC9): SHA-256 of every released binary, attached to the
      # Release so a downloader can verify. Interim until code-signing (PLAT-4).
      - name: Compute SHA-256 checksums
        run: |
          cd artifacts
          sha256sum DistrictSync-windows.exe DistrictSync-linux \
                    DistrictSync-macos.dmg DistrictSync-macos > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows | `DistrictSync-windows.exe` | Code-signed by **myBlueprint Corp.** Double-click to open the app, or run with `--sis`/`--input`/`--output` args for CLI use |
            | Linux   | `DistrictSync-linux`       | `chmod +x` before first run |
            | macOS   | `DistrictSync-macos.dmg`   | Double-click, then drag **DistrictSync** into **Applications** |
            | macOS (headless/CLI) | `DistrictSync-macos` | Command-line only — `chmod +x` before first run |

            **First launch on macOS.** Because the macOS build is unsigned (see below), macOS will say it cannot check the app for malicious software. Open **System Settings › Privacy & Security**, scroll to the message about DistrictSync, and click **Open Anyway**. On macOS 15 and later that is the only route — the old Control-click → Open shortcut no longer works for unsigned apps.

            **Signing.** The Windows executable is code-signed by **myBlueprint Corp.** via Azure Trusted Signing, so Windows names the publisher instead of warning about an unknown one. SmartScreen builds download reputation separately, so a brand-new version can still show a warning for a while. The **macOS and Linux** builds are **not** signed — signing those needs an Apple Developer ID and notarization, which we do not have yet.

            Verify any download against `SHA256SUMS.txt` (e.g. `sha256sum -c SHA256SUMS.txt`).

            See the [SpacesEDU Help Centre article](https://help.spacesedu.com/en-ca/article/mx56qo) for setup basics.
