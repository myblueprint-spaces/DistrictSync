name: flet-verify

# Anti-rot gate: build + smoke the windowed/offline Flet exe on every PR that
# touches the build/UI/deps surface, plus on demand. Thin wrapper around the
# reusable flet-pack.yml so the offline guarantee is self-testing, not tag-only.
#
# SECURITY (RC4): `pull_request` (NEVER `pull_request_target`). A `flet pack` runs
# arbitrary PR code; pull_request runs it in the fork's least-privilege context
# with no repo secrets. The reusable flet-pack.yml grants only `contents: read`,
# and this caller leaves its `upload` input off: the exe is built and smoked, never
# uploaded (DSYNC-54 — nobody downloads a PR build; ~415 MB of storage per run).
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "src/ui_flet/**"
      - "src/main.py"
      # The CLI smokes convert real GDE fixtures through a bundled mapping, so a
      # config or loader change can now break the packed exe on a PR that touches
      # neither the UI nor main.py — the filter has to see those.
      - "config/mappings/**"
      - "src/config/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/flet-pack.yml"
      - ".github/workflows/flet-verify.yml"
      - "scripts/ci_flet_pack_smoke.py"

permissions:
  contents: read

# One run per PR (DSYNC-54): a new push cancels the PR's in-flight run, which a
# later run supersedes anyway. Runs on main/dispatch are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A pull request packs + smokes Linux only (DSYNC-56, owner decision 2026-11-04);
# workflow_dispatch still runs all three OSes, as does every release (release.yml).
jobs:
  pack:
    uses: ./.github/workflows/flet-pack.yml
    with:
      linux_only: ${{ github.event_name == 'pull_request' }}
