[loggers]
keys=root,etl

# NOTE: the rotating file handler is deliberately NOT declared here. fileConfig
# eval()s handler args after interpolating the log path, so a profile path with
# an apostrophe or '%' crashed startup (DSYNC-10). src/utils/logger.py builds
# it in code and attaches it to root + etl.

[handlers]
keys=consoleHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[logger_etl]
level=INFO
handlers=
qualname=etl
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=WARNING
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
