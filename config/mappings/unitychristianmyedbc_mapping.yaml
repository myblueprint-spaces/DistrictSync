# Unity Christian School (Chilliwack) — an independent K-12 school, not an SD.
# Inherits from the standard MyEducation BC mapping.
#
# Built against the school's FIRST real GDE drop (2026-08-31, 6 files) and
# revised for the 2026-09-14 drop, which swapped the emergency-contact export
# for the ENHANCED report while KEEPING the canonical filename. All six
# filenames AND every column name match the MyEd BC canonical set, so there are
# no `source_files` and no column overrides here — only the three genuine
# differences below (homeroom band, generated student email, guardian filter).
_base: myedbc
version: '1.9'
sis: MyEducationBC
district_name: Unity Christian School (Chilliwack)
# The school's PUBLIC staff email domain. It scopes which rows this school's
# admins see in the pickers (plan 0038 S4a/S5) — presentation metadata, not
# access control and not personal data; structurally invisible to the ETL.
district_domains: ["unitychristian.ca"]

global_config:
  # Family is ON as of the 2026-09-14 drop. The school's export is now the
  # ENHANCED emergency-contact report — it carries `Email Address` and
  # `Parent Auth / Guardian` — but the school still writes it out under the
  # CANONICAL filename `EmergencyContactInformation.txt`, which is exactly the
  # file the base Family mapping already points at. So there is no
  # `source_files` override here: only the entity, and the guardian filter it
  # is NOT safe to ship without (see `row_filters` on Family below).
  #
  # Restated in full because deep-merge REPLACES lists.
  enabled_entities:
    - Students
    - Staff
    - Family
    - Classes
    - Enrollments

  # Adds grade 8 to the base K-7 homeroom set. Unity's StudentSchedule.txt
  # covers grades 9-12 ONLY — grade 8 has no timetable rows at all, so without
  # this the 66 active grade-8 pupils would reach Students.csv with zero classes
  # and zero enrollments. Their `Homeroom` IS fully populated (8A/8B/8C, every
  # row carrying a Teacher ID that resolves in the staff file), so homeroom
  # generation is the correct — and only — class source for them. Restated in
  # full because deep-merge REPLACES lists.
  #
  # Grade 9 deliberately STAYS on the timetable side even though it also has
  # homerooms (9A/9B): it has 437 real schedule rows, and a grade listed here
  # gets homeroom classes INSTEAD of subject classes, not as well.
  homeroom_grades: ["IT", "PR", "PK", "TK", "KG", "01", "02", "03", "04", "05", "06", "07", "08"]

mappings:
  Students:
    field_map:
      # The GDE carries no student email column at all: the demographic export
      # has none, and `User name` is populated for grades 9-12 only (155 of 978
      # rows) as a bare login name rather than an address. Generate a unique,
      # stable per-pupil address from the student number — the sd10/sd51/sd74
      # pattern.
      "Email Address":
        format: "{student number}@unitychristian.ca"

  Family:
    # This is an EMERGENCY-contact list, not a guardian list: unfiltered it
    # carries 2,539 rows for 643 students, and 89 of the rows that DO have an
    # email are aunts, friends of the family, homestay coordinators and one
    # doctor. Keep only the contacts the school itself marks as an authorized
    # parent/guardian — the same column, and the same shape, SD60 uses.
    #
    # Measured on the real 2026-09-14 export:
    #   Parent Auth / Guardian = Y ... 1,271 rows, 1,176 with an email, 642 of
    #                                  the 643 students covered.
    #   Contact Level Code in 1,2 .... 1,278 rows, 1,173 with an email — a near
    #                                  tie on volume, but it admits non-guardian
    #                                  aunts/homestay coordinators while missing
    #                                  12 authorized step-fathers and fathers
    #                                  the school filed at level 3-5.
    # The school's own Y/N flag is the statement of fact; the level code is a
    # call-priority ordering that only correlates with it.
    #
    # The 95 kept rows with no email (80 of them Fathers) are dropped downstream
    # by FamilyTransformer's blank-email exclusion with a counted WARNING, so
    # they cost a log line, not a junk row.
    row_filters:
      - column: "Parent Auth / Guardian"
        include: ["Y"]

# ---------------------------------------------------------------------------
# HISTORY — why Family was off, and what changed.
#
# The 2026-08-28 drop's `EmergencyContactInformation.txt` was the PLAIN report:
# 18 columns, no `Email Address` and no `Parent Auth / Guardian`. Family was
# disabled because the entity could only have emitted ~2,483 rows with a blank
# `Email` — the field SpacesEDU keys a family account on — shipping the names
# and relationships of ~1,700 third parties to the vendor with no function.
#
# The 2026-09-14 drop is the ENHANCED report under the SAME filename: five new
# columns (`Contact Type Code`, `Receive Email`, `Prevent Autodialing`,
# `Parent Auth / Guardian`, `Email Address`). No other file changed. That is
# both of the things Family was waiting on, so it is on, filtered to guardians.
#
# STILL OPEN with the school (not config-fixable): the demographic export is
# non-Enhanced and carries no `Enrollment status`, so 20 alumni (DOB 1995-96)
# with no withdraw date still ship as active `UG`.
# ---------------------------------------------------------------------------
