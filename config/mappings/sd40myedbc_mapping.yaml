# SD40 - District mapping (auto-generated by Mapping Editor)
# Inherits from: myedbc
_base: myedbc
# '1.14' — the first config to declare Classes `session_components` (below); a
# build older than config format 1.14 ignores the key and keys blends as before.
version: '1.14'
sis: MyEducationBC
district_name: SD40 - New Westminster School District
# The district's PUBLIC staff email domain. It scopes which district rows this
# district's admins see in the pickers (plan 0038 S4a/S5, LIVE) — a matched admin
# sees this district plus their saved one, with "Show all districts" one click
# away. Presentation metadata, not access control and not personal data;
# structurally invisible to the ETL.
district_domains: ["sd40.bc.ca"]
global_config:
  school_year_sources:
    student_schedule: SD-40_StudentSchedule.csv
  # SD40 tracks attendance in MyEd BC via dedicated ATT--* rows.
  # These are SIS-internal bookkeeping (AM/PM/Daily check-ins) and
  # shouldn't surface as separate classes in SpacesEDU.
  # ATT--Daily appears only in ClassInformation (not StudentSchedule)
  # with Primary Teacher=Y in some rows — exclude it to prevent
  # co-teacher enrollment leaks if a future drop has a matching
  # Section Letter or Master Timetable ID.
  excluded_course_codes:
    - ATT--AM
    - ATT--PM
    - ATT--Daily
mappings:
  Students:
    source_files:
      student_demographic: SD-40_StudentDemographic.csv
    field_map:
      Email Address:
        format: '{student number}@newwestschools.ca'
  Staff:
    source_files:
      staff_info: SD-40_StaffInformation.csv
  Family:
    source_files:
      emergency_contacts: SD-40_StudentEmergencyContact.csv
  Classes:
    source_files:
      student_schedule: SD-40_StudentSchedule.csv
      course_info: SD-40_CourseInformation.csv
      staff_info: SD-40_StaffInformation.csv
      student_demographic: SD-40_StudentDemographic.csv
      class_info: SD-40_ClassInformation.csv
    # The time slot blended classes are keyed on (plan 0053 S10 — owner ruling
    # 2026-09-25). SD40's schedule export carries Semester, Day and Period but NO
    # Term column (see the header list below), and its ClassInformation has no
    # Master Timetable ID, so blended detection runs on the schedule. Declaring
    # the three it has keeps the key byte-identical to what it was before every
    # time-slot column became required (failure-policy §5 #39); leaving the key
    # out would make the missing Term column stop the run.
    session_components: [session_semester, session_day, session_period]
    headers:
      SD-40_StudentSchedule.csv:
      - School Year
      - School Number
      - Student Number
      - PEN
      - Grade
      - Homeroom
      - Course School Number
      - Course Code
      - District Course Code
      - Course Title
      - Short Name
      - Period
      - Day
      - Semester
      - Section Letter
      - Master Timetable ID
      - Teacher ID
      - Teacher Name
      - Primary Teacher
      - Enrolment Status
  Enrollments:
    source_files:
      student_schedule: SD-40_StudentSchedule.csv
      student_demographic: SD-40_StudentDemographic.csv
    field_map:
      User ID:
        student_id_col: Student Number
      Role:
        student_id_col: Student Number
    headers:
      SD-40_StudentSchedule.csv:
      - School Year
      - School Number
      - Student Number
      - PEN
      - Grade
      - Homeroom
      - Course School Number
      - Course Code
      - District Course Code
      - Course Title
      - Short Name
      - Period
      - Day
      - Semester
      - Section Letter
      - Master Timetable ID
      - Teacher ID
      - Teacher Name
      - Primary Teacher
      - Enrolment Status
