# SD51 attendance-only tier — generates ONLY StudentAttendance.csv, fully
# independent of the rostering (advanced-CSV) pipeline. Inherits all of SD51's
# settings AND the base StudentAttendance entity + global_config.attendance
# config, then narrows enabled_entities to just StudentAttendance (deep-merge
# REPLACES the list). Needs only the two absence GDEs in the input folder —
# no rostering GDEs required.
#
#   python -m src.main --sis sd51attendance --input data/input --output data/output
#
_base: sd51myedbc

# Overrides the inherited SD51 `district_name` so the two SD51 rows are
# distinguishable in every district picker. Without it both configs render
# "SD51 - Boundary School District" and picking between them is a coin flip —
# see tests/test_ui_flet_mapping_catalog.py::
# test_bundled_catalog_renders_no_two_identical_labels. Every
# `friendly_district_name` consumer inherits the fix (plan 0038 S3, flag 10);
# a `variant_label` schema field is deliberately deferred to Phase 2.
district_name: "SD51 - Boundary School District · Attendance"

global_config:
  enabled_entities:
    - StudentAttendance
