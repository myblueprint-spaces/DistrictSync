# SD51 - Inherits from standard MyEducation BC mapping
# Differences: source file names, custom email format
_base: myedbc
version: '1.9'
sis: MyEducationBC
district_name: SD51 - Boundary School District
# The district's PUBLIC staff email domain. It scopes which district rows this
# district's admins see in the pickers (plan 0038 S4a/S5, LIVE) — a matched admin
# sees this district plus their saved one, with "Show all districts" one click
# away. Presentation metadata, not access control and not personal data;
# structurally invisible to the ETL.
# Inherited by `sd51attendance` via `_base` — deliberate: the two SD51 tiers
# share one staff domain, so an SD51 admin matches BOTH (the matched-several
# path), which is exactly why each carries a distinct `district_name`.
district_domains: ["sd51.bc.ca"]

global_config:
  # SD51 has no enabled_entities of its own and deep-merge REPLACES lists, so
  # this MUST list the full set — the base 5 rostering entities PLUS the opt-in
  # StudentAttendance — or the rostering entities would vanish. SD51 runs BOTH
  # attendance bands; it declares both `source_files` roles under the
  # `mappings.StudentAttendance` entry below (the base declares none, so each
  # district selects the band(s) it runs by which roles it declares).
  enabled_entities:
    - Students
    - Staff
    - Family
    - Classes
    - Enrollments
    - StudentAttendance

mappings:
  Students:
    source_files:
      student_demographic: "StudentDemographicEnhanced.txt"
    field_map:
      "Email Address":
        format: "{student number}@sd51.bc.ca"

  Staff:
    source_files:
      staff_info: "StaffInformation.txt"

  Classes:
    source_files:
      staff_info: "StaffInformation.txt"
      student_demographic: "StudentDemographicEnhanced.txt"

  Enrollments:
    source_files:
      student_demographic: "StudentDemographicEnhanced.txt"

  # SD51 runs both attendance bands. Declaring both source_files roles selects
  # both bands; the transformer resolves each by role (order-independent), so
  # `daily_absences` first keeps the K-7 daily file as the pipeline's primary.
  #
  # The 8-12 band names the **Enhanced** export — a deliberate SD51 override of
  # the base's standard headerless `StudentPeriodAbsences.txt`, NOT a typo, and
  # NOT to be "corrected" back (see DECISIONS 2026-09-12, which supersedes the
  # 2026-06-19 Slice-3 entry for THIS district only). SD51's MyEd job emits
  # `StudentPeriodAbsencesEnhanced.txt` and has never emitted the standard file:
  # under the old name the band silently resolved to an empty frame and every
  # 8-12 absence was dropped from the delivery.
  #
  # Naming it here also gives it the RIGHT header treatment for free. The base's
  # `headers:` block is keyed by FILENAME (`StudentPeriodAbsences.txt`), so it no
  # longer applies to this district and the Enhanced file is read with its own
  # header row — which is what it needs: it is headerful, carries 19 columns to
  # the standard's 17, and diverges in column order from position 13 (`Office
  # Reason`/`Period Id` where the standard has `Master Timetable ID`), so the
  # base's positional headers would mislabel it. All four columns the
  # pass-through actually sources — `global_config.attendance.period` — match by
  # name in the Enhanced header row, so no `attendance` override is needed.
  StudentAttendance:
    source_files:
      daily_absences: "StudentDailyAbsences.txt"
      period_absences: "StudentPeriodAbsencesEnhanced.txt"
