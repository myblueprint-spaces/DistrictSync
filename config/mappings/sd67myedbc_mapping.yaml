# SD67 - Okanagan Skaha: inherits from standard MyEducation BC mapping, with
# the full myBlueprint+ tier enabled (phase-2 migration; K-12 students, 10-12
# HS course feeds — both are the base defaults, so only the entity tier is
# stated). File naming is standard MyEd BC apart from the demographic extract,
# which the district sends as the ENHANCED export (see the `mappings` block
# below).
_base: myedbc
sis: MyEducationBC
district_name: SD67 - Okanagan Skaha School District
# The district's PUBLIC staff email domain (presentation metadata — see
# sd27myedbc's comment on this same key).
district_domains: ["sd67.bc.ca"]

global_config:
  # Full myBlueprint+ tier. Deep-merge REPLACES lists (see sd51myedbc's
  # comment on this same key), so the full set must be restated here.
  enabled_entities:
    - Students
    - Staff
    - Family
    - Classes
    - Enrollments
    - CourseInfo
    - StudentCourses

# The district's demographic extract is the ENHANCED export, named
# `StudentDemographicEnhanced.txt` rather than the base's
# `StudentDemographicInformation.txt` (the name the district delivers, DSYNC-38;
# it read `StudentDemographicEnh.txt` until then). Restated at all THREE enabled sites that
# read this role (Students, Classes, Enrollments) — `source_files` is a dict, so
# deep merge would happily take a partial override and leave the other two
# entities silently reading a filename this district never delivers (→ an empty
# frame, not an error). Same shape as sd48/sd51myedbc.
mappings:
  Students:
    source_files:
      student_demographic: "StudentDemographicEnhanced.txt"
    field_map:
      # The district's own address scheme, generated rather than read: their
      # demographic export's email entry is inconsistent, so the source column
      # cannot be trusted per-row. Same pattern as sd10/sd51/sd74 — every active
      # student gets a deterministic, correct address. NOT sanitized: the student
      # number is already `[a-z0-9]`, and turning sanitizing on here would change
      # nothing while implying the input needs scrubbing.
      "Email Address":
        format: "{student number}@sd67.bc.ca"

  Classes:
    source_files:
      student_demographic: "StudentDemographicEnhanced.txt"

  Enrollments:
    source_files:
      student_demographic: "StudentDemographicEnhanced.txt"

  # Family reads the district's PARENT export, not the base's emergency-contact
  # one (DSYNC-25). SD67 sends the NON-Enhanced `EmergencyContactInformation.txt`,
  # which has no email column, so every contact was excluded for a blank Email
  # and Family.csv never shipped. `ParentInformation.txt` carries `Email Address`;
  # its only header that differs from the base map is `Surname`. Same shape as
  # sd74myedbc. No row filter: unlike SD60's contacts export this file holds
  # parents only, with no guardian flag to key on.
  Family:
    source_files:
      emergency_contacts: "ParentInformation.txt"
    field_map:
      "Last Name": "Surname"
