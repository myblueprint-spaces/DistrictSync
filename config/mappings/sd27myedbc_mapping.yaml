# SD27 - Cariboo-Chilcotin: inherits from standard MyEducation BC mapping,
# with the full myBlueprint+ tier enabled and the student roster scoped to
# grades 8-12 (phase-2 migration scope). Standard MyEd BC GDE file naming is
# assumed (no source_files overrides here) — adjust once real GDE exports are
# available (see docs/developer/adding-district.md, Steps 1-2).
_base: myedbc
# Quoted deliberately: PyYAML collapses a bare minor with a trailing zero to a
# float (1.10 → 1.1), which the version gate would misread (see
# src/config/loader.py). 1.11 = the first declared use of
# `student_rostering_grades` (plan 0042 1b).
version: '1.11'
sis: MyEducationBC
district_name: SD27 - Cariboo-Chilcotin School District
# The district's PUBLIC staff email domain. Scopes which district rows this
# district's admins see in the pickers (plan 0038 S4a/S5) — presentation
# metadata, not access control and not personal data; structurally invisible
# to the ETL.
district_domains: ["sd27.bc.ca"]

global_config:
  # Full myBlueprint+ tier. Deep-merge REPLACES lists (see sd51myedbc's
  # comment on this same key), so the full set must be restated here.
  enabled_entities:
    - Students
    - Staff
    - Family
    - Classes
    - Enrollments
    - CourseInfo
    - StudentCourses
  # Grades 8-12 only (CEDS OUTPUT space): the OUTERMOST rostering bound —
  # students outside it never reach any output CSV. The chain rule
  # (homeroom ⊆ class ⊆ student) validates on the RESOLVED config, so the
  # base's K-7 homeroom set MUST be overridden here: with no grade 8-and-below
  # elementary population in scope, every rostered class comes from the
  # timetable (timetable scope = student − homeroom = 08-12). If SD27 turns
  # out to roster grade 8 by homeroom, set homeroom_grades: ["08"] instead.
  homeroom_grades: []
  student_rostering_grades: ["08", "09", "10", "11", "12"]
  # HS course feeds cover grades 10-12 — the base default course_start_grade
  # (10) already says exactly that, so it is deliberately not restated.
