# SD45 - Inherits from standard MyEducation BC mapping
# Migrated 2026-09-30 from the district's own gde2acsv-era standalone mapping
# (v1.9, no `_base`), which kept only its `.csv` Enhanced filenames.
# Differences: `.csv` extracts with district-specific filenames
#              (StudentDemographicEnhanced.csv, StaffInformationEnhanced.csv,
#              EmergencyContactInfoEnhanced.csv, StudentSchedule.csv,
#              CourseInformationEnhanced.csv, ClassInformationEnhanced.csv).
# NOT carried over: the old file read PreRegSchoolCode from "Previous school
# number" — the bug the base fixed in PR #12 (a pre-registered student's NEXT
# school is what SpacesEDU wants). The base's "Next school code" is inherited.
# Class IDs keep the START year, as the district's old converter wrote them.
#
# THE SCHEDULE (2026-10-14): Classes + Enrollments read MyEd BC's standard
# Student Schedule GDE (spec v1.17 §2.41 / v1.8 §2.48), exported as
# StudentSchedule.csv — the same shape the base reads (Student ID, District
# Course Code, Section Letter, Master Timetable ID, Teacher ID, Teacher Name,
# Primary Teacher, ...), so every column is inherited. Until then the mapping
# read StudentScheduleDrops.csv, a filename carried over from the district's
# old mapping. That GDE is "Drops only" (spec §2.42 / §2.49; its Change Date
# is the date the section was DROPPED), so every subject enrollment built from
# it was a dropped section. The Drops-only overrides (`Student Number` for the
# schedule's student, `Section` for the class-name section) went with it.
#
# Since 2026-10-13 the district sends ClassInformationEnhanced.csv, which Classes
# now lists: it feeds ClassInformation co-teacher enrollments and counts as
# teaching evidence for Staff. Blended-class detection stays OFF (see below).
_base: myedbc
version: '1.14'
sis: MyEducationBC
district_name: SD45 - West Vancouver School District
# The district's PUBLIC staff email domains (read off the district's own
# 2026-09-28 Staff.csv: wvschools.ca for almost all staff, sd45.bc.ca for the
# rest). Presentation metadata for the pickers, not access control and not
# personal data; structurally invisible to the ETL. The STUDENT domain
# (edu.sd45.bc.ca) is deliberately not listed.
district_domains: ["wvschools.ca", "sd45.bc.ca"]

global_config:
  # School year: deliberately NOT read from the schedule yet. Whether SD45's
  # `School Year` column holds a bare START or END year is unconfirmed (a bare
  # start year read as the end year would stamp LAST year on every class), so
  # the inherited source (StudentSchedule.txt, which SD45 does not send — its
  # schedule is StudentSchedule.csv) is left in place and the year comes from
  # today's date + the 07-25 rollover — exactly what the district's own mapping
  # did. Point this at StudentSchedule.csv once a sample value is confirmed.
  # Blended-class detection stays OFF although ClassInformationEnhanced.csv now
  # arrives (2026-10-13). Turning it on would merge same-teacher/same-time-slot
  # sections into new BLENDED_<key>_<year> Class IDs, re-keying sections the
  # district's old converter (and every night since 2026-09-30) shipped under
  # their own Master Timetable ID — on a live district that empties classes
  # teachers already use. Off, the file still feeds co-teacher enrollments
  # (Primary Teacher = Y rows, linked to homeroom classes by School Number +
  # Section Letter) and stays OPTIONAL at the input gate: a night without it
  # runs, co-teachers left out, with a standing warning.
  blended_classes: false
  # SD45's pre-DistrictSync converter suffixed every Class ID with the START
  # year of the school year (2026-27 -> <MTID>_2026, <school>_<homeroom>_2026).
  # Keep that, or the switch-over re-keys all ~2,400 classes and empties the
  # ones teachers have used since September. Never change this on a live district.
  class_id_year: start

mappings:
  Students:
    source_files:
      student_demographic: "StudentDemographicEnhanced.csv"

  Staff:
    source_files:
      staff_info: "StaffInformationEnhanced.csv"

  Family:
    source_files:
      emergency_contacts: "EmergencyContactInfoEnhanced.csv"

  Classes:
    source_files:
      student_schedule: "StudentSchedule.csv"
      course_info: "CourseInformationEnhanced.csv"
      staff_info: "StaffInformationEnhanced.csv"
      student_demographic: "StudentDemographicEnhanced.csv"
      # Header: School Number, Course Code, Teacher Id, Primary Teacher, Section
      # Letter, Semester, Term, Day, Period, Master Timetable ID, Class
      # Identifier, Schedule Expression, Max, Unrotated Schedule. Co-teachers
      # read School Number + Teacher Id + Primary Teacher + Section Letter (the
      # Enrollments `source_columns` defaults); Course Code applies
      # `excluded_course_codes`. Class NAMES come from the schedule alone.
      class_info: "ClassInformationEnhanced.csv"

  Enrollments:
    source_files:
      student_schedule: "StudentSchedule.csv"
      student_demographic: "StudentDemographicEnhanced.csv"
