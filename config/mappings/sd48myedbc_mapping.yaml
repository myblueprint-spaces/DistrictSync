# SD48 - Inherits from standard MyEducation BC mapping
# Differences: StudentDemographicEnhanced.txt, StaffInformation.txt (no "Enhanced" suffix)
_base: myedbc
version: '1.9'
sis: MyEducationBC
district_name: SD48 - Sea to Sky School District
# The district's PUBLIC staff email domain. It WILL scope which district rows this
# district's admins see in the pickers once the picker filter lands (plan 0038,
# S4a/S5) — NOTHING READS THIS KEY TODAY; every picker still shows all eleven
# configs. Presentation metadata, not access control and not personal data;
# structurally invisible to the ETL.
district_domains: ["sd48.bc.ca"]

mappings:
  Students:
    source_files:
      student_demographic: "StudentDemographicEnhanced.txt"

  Staff:
    source_files:
      staff_info: "StaffInformation.txt"

  Classes:
    source_files:
      staff_info: "StaffInformation.txt"
      student_demographic: "StudentDemographicEnhanced.txt"

  Enrollments:
    source_files:
      student_demographic: "StudentDemographicEnhanced.txt"

