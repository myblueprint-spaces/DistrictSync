# SD71 - Comox Valley: inherits from standard MyEducation BC mapping, with
# the full myBlueprint+ tier enabled (phase-2 migration; K-12 students, 10-12
# HS course feeds — both are the base defaults, so only the entity tier is
# stated). Standard MyEd BC GDE file naming is assumed (no source_files
# overrides here) — adjust once real GDE exports are available (see
# docs/developer/adding-district.md, Steps 1-2).
_base: myedbc
sis: MyEducationBC
district_name: SD71 - Comox Valley School District
# The district's PUBLIC staff email domain (presentation metadata — see
# sd27myedbc's comment on this same key).
district_domains: ["sd71.bc.ca"]

global_config:
  # Full myBlueprint+ tier. Deep-merge REPLACES lists (see sd51myedbc's
  # comment on this same key), so the full set must be restated here.
  enabled_entities:
    - Students
    - Staff
    - Family
    - Classes
    - Enrollments
    - CourseInfo
    - StudentCourses
