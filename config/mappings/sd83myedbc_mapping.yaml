# SD83 - K̓wsaltktnéws ne Secwepemcúl’ecw (formerly North Okanagan-Shuswap): inherits from standard MyEducation BC
# mapping, with the myBlueprint+ course entities enabled and district-specific
# grade overrides. Standard MyEd BC GDE file naming is assumed (no
# source_files overrides here) — adjust once real GDE exports are available
# (see docs/developer/adding-district.md, Steps 1-2).
_base: myedbc
# Quoted deliberately: PyYAML collapses a bare 1.10 to the float 1.1, which the
# version gate would silently read as minor 1 (see src/config/loader.py).
#
# 1.12 (2026-09-14): the Staff overrides below use two ETL-AFFECTING features an
# older build would get WRONG rather than merely ignore — `row_filters` on the
# Staff entity (a pre-1.12 build reads the key only on Family, so it would ship
# every excluded Prefix row) and the `normalize_staff_role` transform (absent from a
# pre-1.12 ALLOWED_TRANSFORMS, so that build refuses the config at load, loudly).
version: '1.12'
sis: MyEducationBC
# Renamed 2026-09-03 (owner) to the district's own Secwepemc name, exactly as its
# 2026-09-03 sheet spells it: K + U+0313 COMBINING COMMA ABOVE, then e-acute,
# u-acute, and U+2019 RIGHT SINGLE QUOTATION MARK. Formerly "North
# Okanagan-Shuswap School District". This file is UTF-8 and is READ as UTF-8
# (src/config/loader._load_yaml pins the encoding — before 2026-09-03 it used the
# platform locale, which on Windows decoded this line into mojibake in silence).
district_name: SD83 - K̓wsaltktnéws ne Secwepemcúl’ecw
# The district's PUBLIC staff email domain. Scopes which district rows this
# district's admins see in the pickers (plan 0038 S4a/S5) — presentation
# metadata, not access control and not personal data; structurally invisible
# to the ETL.
district_domains: ["sd83.bc.ca"]

global_config:
  # Full myBlueprint+ tier: the 5 standard rostering entities plus CourseInfo +
  # StudentCourses. Deep-merge REPLACES lists (see sd51myedbc's comment on
  # this same key), so the full set must be restated here.
  enabled_entities:
    - Students
    - Staff
    - Family
    - Classes
    - Enrollments
    - CourseInfo
    - StudentCourses
  # Adds grade 8 to the base K-7 homeroom set (self-contained homerooms
  # through grade 8; base default stops at 07). Restated in full for the same
  # deep-merge-replaces-lists reason as enabled_entities above.
  homeroom_grades: ["IT", "PR", "PK", "TK", "KG", "01", "02", "03", "04", "05", "06", "07", "08"]
  # SpacesEDU is licensed for K-8 here, so the grades that get CLASS rostering
  # are EXACTLY the homeroom grades above: no grade 9-12 timetable classes and
  # no blended classes spanning only 9-12. `"homeroom"` is the sugar for
  # "rostered == homeroom_grades", so the list above is stated once and the two
  # keys cannot drift.
  #
  # Grades 9-12 deliberately STAY on the roster: Students.csv keeps them (with
  # no class enrollments — confirmed acceptable output, DECISIONS 2026-08-13),
  # because StudentCourses filters against the active roster and dropping them
  # would empty the myBlueprint+ transcripts this district asked for.
  class_rostering_grades: "homeroom"
  # CourseInfo + StudentCourses include grades 9-12 (base default is 10-12).
  course_start_grade: 9

mappings:
  Students:
    field_map:
      # Date of Birth withheld from the output. The column stays in
      # Students.csv (contract-required) but every row is blank rather than
      # the source value.
      "Date of Birth":
        value: ""

  # SD83 states each person's ROLE outright instead of relying on the Y/N
  # teaching flag. Their StaffInformationEnhanced.txt header is:
  #
  #   "School Number","User Name","Teaching Staff","Teacher Id","Name",
  #   "Prefix","Last Name","First Name","Email Address","Staff Status"
  #
  # `Prefix` is MyEd BC's courtesy-title column (Mr./Ms./Dr. elsewhere), which
  # the district has repurposed to carry "Teacher" / "Administrator". Deep merge
  # means `Role` is the ONLY field overridden here — the source file name and
  # every other mapped column stay the standard MyEd BC ones from `_base`.
  Staff:
    # Applied before the field map, so an excluded person never reaches output.
    #
    # The district populates this file with teachers and actual administrators,
    # so anything else in `Prefix` is not a role we can publish — those rows are
    # EXCLUDED rather than guessed at or shipped with a blank Role (the Advanced
    # CSV contract accepts only the two values).
    #
    # DELIBERATELY NOT a `Staff Status` filter as well. Departed staff are
    # already excluded for EVERY district by `filter_departed_staff`, which
    # decides on the DATA rather than on config and fails OPEN twice over (an
    # unrecognised status vocabulary, or a filter that would keep zero rows,
    # warns and ships everyone). A row_filters entry here would be redundant on
    # the happy path and strictly WORSE on the unhappy one: row_filters fails
    # CLOSED, so the day SD83 spells its statuses differently it would deliver
    # an EMPTY Staff.csv instead of a warning.
    #
    # Matching is case- and whitespace-INSENSITIVE on both sides (the value
    # below and the export's cells are trimmed + case-folded before comparison),
    # but it is exact SET membership, never a substring test. Pinned by
    # tests/test_transform_staff.py::TestStaffRowFilters, both directions.
    #
    # `Prefix` is REQUIRED once named here: apply_row_filters raises if it is
    # missing from the export, so a renamed column fails the run loudly instead
    # of silently keeping everyone or no one.
    row_filters:
      - column: "Prefix"
        include: ["Teacher", "Administrator"]
    field_map:
      # Role comes from the stated value, NOT from `map_role` on the teaching
      # flag (the base mapping's default, which sends every non-"Y" row to
      # "administrator"). Matching is case-insensitive; a value the row_filters
      # above did not already exclude blanks that one cell and is recorded as a
      # data error rather than defaulting to a role.
      "Role":
        column: "Prefix"
        transform: "normalize_staff_role"
