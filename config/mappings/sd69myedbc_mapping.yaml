# SD69 - Qualicum: inherits from standard MyEducation BC mapping, with the
# full myBlueprint+ tier enabled and the HS course feeds extended down to
# grade 9 (phase-2 migration; K-12 students = the base default). Standard
# MyEd BC GDE file naming is assumed (no source_files overrides here) —
# adjust once real GDE exports are available (see
# docs/developer/adding-district.md, Steps 1-2).
_base: myedbc
sis: MyEducationBC
district_name: SD69 - Qualicum School District
# The district's PUBLIC staff email domain (presentation metadata — see
# sd27myedbc's comment on this same key).
district_domains: ["sd69.bc.ca"]

global_config:
  # Full myBlueprint+ tier. Deep-merge REPLACES lists (see sd51myedbc's
  # comment on this same key), so the full set must be restated here.
  enabled_entities:
    - Students
    - Staff
    - Family
    - Classes
    - Enrollments
    - CourseInfo
    - StudentCourses
  # Course feeds cover grades 9-12 (the base default floor is 10) — the same
  # setting SD83 uses; grades below 9 stay excluded from CourseInfo and
  # StudentCourses.
  course_start_grade: 9
